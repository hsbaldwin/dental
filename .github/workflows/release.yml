# v* 태그: 같은 검사를 통과하면 GHCR에 이미지를 올림. 서버 배포는 개발자가 deploy/deploy.sh로(시간대를 사람이 고름).
name: Release image
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: 테스트 + 체험판 빌드
        run: npm run check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드 · 올리기 (:vX.Y.Z, :sha)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker build --build-arg APP_VERSION="$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:sha-${GITHUB_SHA::12}" .
          docker run -d --name smoke -e ADMIN_PASSWORD=release-check-12345 "$IMAGE:$TAG"
          for i in $(seq 1 20); do docker exec smoke wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q "\"version\":\"$TAG\"" && ok=1 && break; sleep 2; done
          docker rm -f smoke
          test "${ok:-}" = 1
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
